<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - effects - ascii</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="main.css">
	</head>

	<body>
		<script type="module">

			import * as THREE from 'three';
         	import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';
            import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js'

			let camera, controls, scene, renderer, effect;

			let sphere, plane , sphere2;

			const start = Date.now();

			init();

			function init() {

				camera = new THREE.PerspectiveCamera( 100, window.innerWidth / window.innerHeight, 1, 10000 );
				camera.position.y = 150;
				camera.position.z = 500;

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0, 0, 0 );

				const pointLight1 = new THREE.PointLight( 0xffffff, 3, 0, 0 );
				pointLight1.position.set( 500, 500, 500 );
				scene.add( pointLight1 );

				const pointLight2 = new THREE.PointLight( 0xffffff, 1, 0, 0 );
				pointLight2.position.set( - 500, - 500, - 500 );
				scene.add( pointLight2 );

				sphere = new THREE.Mesh( new THREE.IcosahedronGeometry( 200 , 2 ), new THREE.MeshPhongMaterial( { flatShading: true } ) );
				scene.add( sphere );


     			sphere2 = new THREE.Mesh( new THREE.SphereGeometry( 200, 20, 10 ), new THREE.MeshPhongMaterial( { flatShading: true } ) );
     			// scene.add( sphere2 );


				// Plane

				plane = new THREE.Mesh( new THREE.PlaneGeometry( 400, 400 ), new THREE.MeshBasicMaterial( { color: 0xe4e0e0 } ) );
				plane.position.y = - 200;
				plane.rotation.x = - Math.PI / 2;
				scene.add( plane );

				renderer = new THREE.WebGLRenderer();
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );

				effect = new AsciiEffect( renderer, ' #&!2!67', { invert: true } );
				effect.setSize( window.innerWidth, window.innerHeight );
				effect.domElement.style.color = 'orange';
				effect.domElement.style.backgroundColor = 'black';

				// Special case: append effect.domElement, instead of renderer.domElement.
				// AsciiEffect creates a custom domElement (a div container) where the ASCII elements are placed.

				document.body.appendChild( effect.domElement );

				controls = new OrbitControls( camera, effect.domElement );
				controls.enableDamping = true;
				controls.dampingFactor = 0.02;
				controls.enableRotate = true;
				controls.minDistance = 400
				//

				window.addEventListener( 'resize', onWindowResize );
				window.addEventListener('dblclick', doubleClickResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
			    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
				effect.setSize( window.innerWidth, window.innerHeight );

			}

			function doubleClickResize() {
                    const fullscreenElement = document.fullscreenElement || document.webkitFullscreenElement

                    if(!fullscreenElement)
                    {
                        if(effect.domElement.requestFullscreen)
                        {
                            effect.domElement.requestFullscreen()
                        }
                        else if(effect.domElement.webkitRequestFullscreen)
                        {
                            effect.domElement.webkitRequestFullscreen()
                        }
                    }
                    else
                    {
                        if(document.exitFullscreen)
                        {
                            document.exitFullscreen()
                        }
                        else if(document.webkitExitFullscreen)
                        {
                            document.webkitExitFullscreen()
                        }
                    }
            }

			//

			function animate() {

				const timer = Date.now() - start;

				sphere.position.y = Math.abs( Math.sin( timer * 0.002 ) * 100);
				sphere.rotation.x = timer * 0.0004;
				sphere.rotation.z = timer * 0.0002;


				sphere2.position.y = Math.abs( Math.sin( timer * 0.0002 ) ) * 150;
				sphere2.rotation.x = timer * 0.0003;
				sphere2.rotation.z = timer * 0.0009;

				controls.update();

				effect.render( scene, camera );

			}

		</script>

	</body>
</html>
